<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0f">
  <meta name="description" content="Estatísticas da sua conta na Rivals Arena.">
  <title>Perfil | Rivals Arena</title>
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="stylesheet" href="../css/fonte-titulos.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="perfil">
  <header id="hdr" class="site-header"></header>
  <main>
    <section class="page-header">
     
      <h1>Perfil</h1>
   
    </section>

    <section class="section page-content">
      <div class="profile-panel" id="profile">
        <p class="meta">Carregando Perfil...</p>
        <button class="button-secondary compact" type="button" id="edit-profile-name" hidden>Editar nome</button>
        <form class="profile-edit-form" id="profile-name-form" hidden>
          <div class="profile-edit-field">
            <label for="profile-name-input">Nome de exibição</label>
            <input class="search-input" id="profile-name-input" name="nome" type="text" autocomplete="nickname" minlength="2" maxlength="80" required aria-describedby="profile-name-feedback">
          </div>
          <div class="profile-edit-actions">
            <button class="button-secondary" type="button" id="cancel-profile-name">Cancelar</button>
            <button class="button-primary compact" type="submit" id="save-profile-name">Salvar nome</button>
          </div>
        </form>
        <p class="meta profile-name-feedback" id="profile-name-feedback" role="status" aria-live="polite" hidden></p>
        <div class="profile-stats" id="profile-stats" hidden></div>
      </div>
      <section class="panel account-danger-zone" aria-labelledby="delete-account-title">
        <h2 id="delete-account-title">Excluir minha conta</h2>
        <p>Ao excluir sua conta, seu nome e email serão anonimizados. Partidas, resultados e histórico competitivo serão preservados, sem identificação pessoal.</p>
        <p class="meta" role="status">Esta ação é permanente e encerra sua sessão.</p>
        <button class="button-danger" type="button" id="delete-account-button">Excluir minha conta</button>
        <p class="meta" id="delete-account-feedback" role="status" aria-live="polite" hidden></p>
      </section>
    </section>
  </main>

  <footer>© 2026 Rivals Arena — Projeto Acadêmico.</footer>
  <script src="../js/comum.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
